[project]
name = "novera"
version = "0.1.0"
description = "AI-native market and counterparty risk intelligence platform for global trading portfolios"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "duckdb>=1.0",
    "pyarrow>=16",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "streamlit>=1.36",
    "typer>=0.12",
    "python-dateutil>=2.9",
    "QuantLib>=1.34",
    "anthropic>=0.30",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
novera = "novera.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/novera"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "N813"]
"src/novera/api/app.py" = ["B008"]
"src/novera/reporting/pack.py" = ["E501"]
"src/novera/ai/provider.py" = ["E501"]
"src/novera/ai/tools.py" = ["E501"]
"src/novera/pricing/exotic_formulas.py" = ["N806"]
"src/novera/ai/drafts.py" = ["E501"]
"src/novera/ai/agents/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[dependency-groups]
dev = [
    "playwright>=1.62.0",
]
